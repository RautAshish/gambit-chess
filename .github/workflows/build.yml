name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Android SDK is preinstalled on ubuntu-latest runners.

      - name: Run unit tests (29 tests - engine, clock, results, parsing)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK (download from the Actions run page)
        uses: actions/upload-artifact@v4
        with:
          name: gambit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
