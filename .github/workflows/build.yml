name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # workflow publishes its logs to ci-logs branches

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle Stockfish (official sf_18, android arm64)
        run: |
          curl -sL -o /tmp/sf.tar \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar
          tar xf /tmp/sf.tar -C /tmp
          BIN=$(find /tmp/stockfish* -type f -name 'stockfish*' | head -1)
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          echo "Bundled engine size:" && ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Unit tests (41) + debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Android Lint (captured, non-blocking)
        shell: bash
        run: |
          ./gradlew :app:lintDebug --console=plain 2>&1 | tee -a build.log || echo "LINT FOUND ISSUES (see report)" | tee -a build.log
          { echo "===== LINT SUMMARY ====="; grep -E "Warning:|Error:" app/build/reports/lint-results-debug.txt 2>/dev/null | head -60; } >> build.log || true

      - name: Materialize release keystore (when the secret exists)
        env:
          KS_B64: ${{ secrets.GAMBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /home/runner/gambit-release.jks
            echo "keystore materialized — release will be PLAY-SIGNED"
          else
            echo "no GAMBIT_KEYSTORE_B64 secret — release falls back to debug signing"
          fi
      - name: Release build (R8) — AAB + APK, signed if secrets present
        env:
          GAMBIT_KEYSTORE_PATH: /home/runner/gambit-release.jks
          GAMBIT_KEYSTORE_PASSWORD: ${{ secrets.GAMBIT_KEYSTORE_PASSWORD }}
          GAMBIT_KEY_ALIAS: ${{ secrets.GAMBIT_KEY_ALIAS }}
          GAMBIT_KEY_PASSWORD: ${{ secrets.GAMBIT_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace 2>&1 | tail -5
      - name: Upload release bundle (Play Store artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gambit-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Upload release APK (sideload-testable)
        uses: actions/upload-artifact@v4
        with:
          name: gambit-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gambit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish build log
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          tail -c 90000 build.log > ci-build.log || echo "no log" > ci-build.log
          git config user.email ci@gambit && git config user.name ci-bot
          git checkout -B ci-logs
          git add -f ci-build.log && git commit -m "CI log $GITHUB_SHA" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bundle Stockfish (official sf_18, android arm64)
        run: |
          curl -sL -o /tmp/sf.tar \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar
          tar xf /tmp/sf.tar -C /tmp
          BIN=$(find /tmp/stockfish* -type f -name 'stockfish*' | head -1)
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          echo "Bundled engine size:" && ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Boot emulator and run UI tests (fully logged)
        shell: bash
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          {
            echo "=== STEP 1: install emulator + system image ==="
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "system-images;android-29;default;x86_64" "emulator" "platform-tools" > /dev/null 2>&1
            echo "sdkmanager exit=$?"
            echo "=== STEP 2: create AVD ==="
            echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
              -n ci -k "system-images;android-29;default;x86_64" -d pixel_5 --force
            echo "avd dir contents:"; ls -la "$ANDROID_AVD_HOME" || true
            echo "=== STEP 3: boot emulator (output -> emu.log) ==="
            nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -gpu swiftshader_indirect \
              -no-snapshot -noaudio -no-boot-anim -accel on > emu.log 2>&1 &
            adb start-server
            adb wait-for-device
            BOOTED=0
            for i in $(seq 1 60); do
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$boot" = "1" ]; then echo "BOOT-COMPLETED after ~$((i*5))s"; BOOTED=1; break; fi
              sleep 5
            done
            echo "--- first 15 lines of emu.log ---"; head -15 emu.log
            adb devices
            if [ "$BOOTED" = "1" ]; then
              adb shell settings put global window_animation_scale 0 || true
              adb shell settings put global transition_animation_scale 0 || true
              adb shell settings put global animator_duration_scale 0 || true
              echo "=== STEP 4: connectedDebugAndroidTest ==="
              ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain
              echo "GRADLE_EXIT=$?"
            else
              echo "BOOT FAILED - emu.log tail:"; tail -40 emu.log
              echo "GRADLE_EXIT=1"
            fi
          } > ui.log 2>&1
          RC=$(grep -o 'GRADLE_EXIT=[0-9]*' ui.log | tail -1 | cut -d= -f2)
          tail -50 ui.log
          exit ${RC:-1}

      - name: Verify R8 release build launches (crash gate)
        if: success()
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          {
            echo "=== RELEASE CRASH GATE ==="
            ./gradlew assembleRelease --console=plain 2>&1 | tail -3
            adb uninstall com.chessapp
            adb install -r app/build/outputs/apk/release/app-release.apk
            echo "install exit=$?"
            adb logcat -c
            adb shell am start -W -n com.chessapp/.MainActivity
            sleep 8
            PID=$(adb shell pidof com.chessapp | tr -d '\r')
            echo "pid=[$PID]"
            adb logcat -d > rel_logcat.txt
            FATALS=$(grep -c "FATAL EXCEPTION" rel_logcat.txt)
            echo "fatals=$FATALS"
            if [ -z "$PID" ] || [ "$FATALS" != "0" ]; then
              echo "RELEASE BUILD DIED"
              grep -A25 "FATAL EXCEPTION" rel_logcat.txt | head -50
              echo "GATE_EXIT=1"
            else
              echo "Release launch: ALIVE, no fatals"
              echo "GATE_EXIT=0"
            fi
          } >> ui.log 2>&1
          tail -40 ui.log
          exit $(grep -o 'GATE_EXIT=[0-9]*' ui.log | tail -1 | cut -d= -f2)

      - name: Publish UI test log
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          tail -c 90000 ui.log > ci-ui.log 2>/dev/null || echo "no ui log" > ci-ui.log
          git config user.email ci@gambit && git config user.name ci-bot
          git checkout -B ci-logs-ui
          git add -f ci-ui.log && git commit -m "UI log $GITHUB_SHA" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-ui
