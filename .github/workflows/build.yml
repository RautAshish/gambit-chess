name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish its own log to the ci-logs branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Tests + debug APK (log captured)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gambit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish build log to ci-logs branch (readable via API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 80000 build.log > ci-build.log || echo "no log" > ci-build.log
          git config user.email "ci@gambit" && git config user.name "ci-bot"
          git checkout -B ci-logs
          git add -f ci-build.log
          git commit -m "CI log for $GITHUB_SHA" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

  ui-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain > ui-test.log 2>&1

      - name: Publish UI-test log (readable via API)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { tail -c 40000 ui-test.log 2>/dev/null; echo "=== XML TEST RESULTS ==="; find app/build -path "*androidTest*" -name "*.xml" 2>/dev/null | head -3 | xargs -r cat; } | tail -c 80000 > ci-ui-test.log
          [ -s ci-ui-test.log ] || echo "no log" > ci-ui-test.log
          git config user.email "ci@gambit" && git config user.name "ci-bot"
          git checkout -B ci-ui-logs
          git add -f ci-ui-test.log
          git commit -m "UI test log for $GITHUB_SHA" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-ui-logs
