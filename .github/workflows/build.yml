name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # workflow publishes its logs to ci-logs branches

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (41) + debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Android Lint (captured, non-blocking)
        shell: bash
        run: |
          ./gradlew :app:lintDebug --console=plain 2>&1 | tee -a build.log || echo "LINT FOUND ISSUES (see report)" | tee -a build.log
          { echo "===== LINT SUMMARY ====="; grep -E "Warning:|Error:" app/build/reports/lint-results-debug.txt 2>/dev/null | head -60; } >> build.log || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gambit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish build log
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          tail -c 90000 build.log > ci-build.log || echo "no log" > ci-build.log
          git config user.email ci@gambit && git config user.name ci-bot
          git checkout -B ci-logs
          git add -f ci-build.log && git commit -m "CI log $GITHUB_SHA" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI smoke tests on emulator (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "SCRIPT-STARTED emulator booted ok" > ui.log
            ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain >> ui.log 2>&1
            status=$?
            tail -40 ui.log
            exit $status

      - name: Publish UI test log
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          tail -c 90000 ui.log > ci-ui.log 2>/dev/null || echo "no ui log" > ci-ui.log
          git config user.email ci@gambit && git config user.name ci-bot
          git checkout -B ci-logs-ui
          git add -f ci-ui.log && git commit -m "UI log $GITHUB_SHA" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-ui
