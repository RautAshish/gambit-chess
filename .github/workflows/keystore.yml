name: generate-keystore
# Generates a Play upload keystore with RANDOM credentials created inside the
# runner — nothing sensitive is ever a workflow input or printed to the log.
# HARD-GATED to private repos: on a public repo, run pages, logs, and
# artifacts are world-readable, so generation here would leak the key.
on:
  workflow_dispatch: {}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on a public repository
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          PRIV=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | \
            python3 -c "import json,sys;print(json.load(sys.stdin)['private'])")
          if [ "$PRIV" != "True" ]; then
            echo "::error::Repo is PUBLIC — artifacts and logs would expose the key."
            echo "::error::Settings -> General -> Danger Zone -> make private, run this, then flip back if you wish."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Generate keystore with random credentials (never logged)
        run: |
          STOREPASS=$(openssl rand -base64 18)
          KEYPASS=$(openssl rand -base64 18)
          keytool -genkeypair -keystore gambit-release.jks -alias gambit \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -dname "CN=Gambit Chess, OU=Mobile, O=Gambit" >/dev/null 2>&1
          base64 -w0 gambit-release.jks > keystore.b64
          {
            echo "GAMBIT_KEYSTORE_B64=$(cat keystore.b64)"
            echo "GAMBIT_KEYSTORE_PASSWORD=$STOREPASS"
            echo "GAMBIT_KEY_PASSWORD=$KEYPASS"
            echo "GAMBIT_KEY_ALIAS=gambit"
          } > SECRETS_TO_ADD.txt
          echo "Done. Download the artifact; each line of SECRETS_TO_ADD.txt is one repo secret."
          echo "KEEP THE ARTIFACT FOREVER (password manager) — it IS your upload key."
      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-SAVE-FOREVER
          path: |
            keystore.b64
            SECRETS_TO_ADD.txt
          retention-days: 3
