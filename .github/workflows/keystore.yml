name: generate-keystore
on:
  workflow_dispatch:
    inputs:
      storepass:
        description: Keystore password (save it!)
        required: true
      keypass:
        description: Key password (save it!)
        required: true
      alias:
        description: Key alias
        default: gambit
        required: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Generate upload keystore
        run: |
          keytool -genkeypair -v -keystore gambit-release.jks \
            -alias "${{ inputs.alias }}" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.storepass }}" -keypass "${{ inputs.keypass }}" \
            -dname "CN=Gambit Chess, OU=Mobile, O=Gambit"
          base64 -w0 gambit-release.jks > keystore.b64
          echo "NEXT: download the keystore-b64 artifact; paste its contents into"
          echo "repo secret GAMBIT_KEYSTORE_B64, plus your passwords and alias into"
          echo "GAMBIT_KEYSTORE_PASSWORD / GAMBIT_KEY_PASSWORD / GAMBIT_KEY_ALIAS."
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64
          retention-days: 3
